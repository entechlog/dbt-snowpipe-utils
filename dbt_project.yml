name: 'dbt_snowpipe_utils'
version: '1.0.0'

profile: 'dbt_snowpipe_utils'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

vars:
  # =============================================================================
  # DATABASE AND WAREHOUSE CONFIGURATION
  # =============================================================================
  snowpipe_database: "{{ env_var('SNOWPIPE_DATABASE', 'RAW_DB') }}"
  snowpipe_schema: "{{ env_var('SNOWPIPE_SCHEMA', 'UTIL') }}"
  snowpipe_warehouse: "{{ env_var('SNOWPIPE_WAREHOUSE', 'COMPUTE_WH') }}"
  
  # =============================================================================
  # STAGE NAMES
  # =============================================================================
  snowpipe_json_stage: "{{ env_var('SNOWPIPE_JSON_STAGE', 'JSON_STAGE') }}"
  snowpipe_parquet_stage: "{{ env_var('SNOWPIPE_PARQUET_STAGE', 'PARQUET_STAGE') }}"
  snowpipe_csv_stage: "{{ env_var('SNOWPIPE_CSV_STAGE', 'CSV_STAGE') }}"
  
  # =============================================================================
  # SNOWFLAKE CONFIGURATION
  # =============================================================================
  snowpipe_enable_error_integration: "{{ env_var('SNOWPIPE_ENABLE_ERROR_INTEGRATION', 'false') | as_bool }}"
  snowpipe_error_integration: "{{ env_var('SNOWPIPE_ERROR_INTEGRATION', 'SNOWPIPE_ERROR_NOTIFICATION') }}"
  
  # =============================================================================
  # ROLE CONFIGURATION
  # =============================================================================
  snowpipe_admin_role: "{{ env_var('SNOWPIPE_ADMIN_ROLE', 'SYSADMIN') }}"
  snowpipe_monitor_roles: "{{ env_var('SNOWPIPE_MONITOR_ROLES', 'SYSADMIN') }}"